name: create_draft_release

on:
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> create_draft_release ( ${{ github.run_attempt }} )

jobs:

  create_draft_release:
    name: create_draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: bun install

    - name: Get version
      id: get_version
      run: |
        export version=$(node -p "require('./package.json').version")
        echo "version=$version" >> $GITHUB_OUTPUT

    #validates that the version is a valid semver
    - name: Validate version
      id: validate_version
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version: $VERSION"
          exit 1
        fi

    - name: Type check and test
      run: bun run typecheck && bun test

    - name: Build
      run: bun run build

    - name: Display structure of build files
      id: display_build_files
      run: |
        ls -R dist/

    - name: Archive all artifacts in dist/
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-v${{ steps.get_version.outputs.version }}
        path: dist/
        if-no-files-found: error

    - name: Create release branch
      run: |
        branch="release/v${{ steps.get_version.outputs.version }}"
        git checkout -B "$branch"
        # A re-dispatch finds the branch its predecessor pushed: replace it, it
        # only marks the commit the release was built from.
        git push --force origin "HEAD:$branch"

    - name: Create DRAFT release through github cli and upload assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="v${{ steps.get_version.outputs.version }}"
        # A re-run finds the draft left behind by the attempt that failed:
        # reuse it, but refuse to touch a release that was already published.
        state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)
        if [ "$state" = "missing" ]; then
          gh release create "$tag" --title "$tag" --generate-notes --draft
        elif [ "$state" = "false" ]; then
          echo "release $tag is already published" >&2
          exit 1
        fi
        # Files only: `dist/*` handed gh the `dist/stats/` directory, which it
        # tried to read as an asset. Nested declarations upload under their
        # basename, and no two files in dist/ share one.
        find dist -type f -print0 | xargs -0 gh release upload "$tag" --clobber
