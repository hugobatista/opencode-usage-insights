name: test

on:
  push:
    branches: [master, main]
    paths:
      - '**.ts'
      - '**.tsx'
      - 'test/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> test ( ${{ github.run_attempt }} )

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Echo current date and time
        id: datetime
        run: |
          echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      # The data layer (paths, database, recorder, queries, panel assembly, dump
      # round-trip, file permissions) against a throwaway database. The script
      # is also the cross-platform check: it has no rendering dependency, so it
      # runs on the machine the plugin actually runs on.
      - name: Platform check
        run: bun run check:platform

      # The whole suite, rendering tests included: the TUI's native stack
      # (OpenTUI) is here.
      - name: Run tests
        run: bun test

      - name: Bench the read paths
        run: bun run bench --budget
