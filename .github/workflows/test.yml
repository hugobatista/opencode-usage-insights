name: test

on:
  push:
    branches: [master, main]
    paths:
      - '**.ts'
      - '**.tsx'
      - 'test/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> test ( ${{ github.run_attempt }} )

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Echo current date and time
        id: datetime
        run: |
          echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      # The plugin runs wherever OpenCode runs: the data layer (paths, database,
      # recorder, queries, panel assembly, dump round-trip, file permissions)
      # is exercised on every OS, against a throwaway database.
      - name: Platform check
        run: bun run check:platform

      # The rendering tests drive the TUI's native stack (OpenTUI), which CI
      # only has on Linux; every other test file is platform-independent and
      # runs everywhere. Ubuntu runs the whole suite.
      - name: Run tests (full, Linux)
        if: runner.os == 'Linux'
        run: bun test

      - name: Run tests (data layer, other systems)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          bun test \
            test/core.test.ts \
            test/db.test.ts \
            test/endpoint.test.ts \
            test/line.test.ts \
            test/maintenance.test.ts \
            test/panel-build.test.ts \
            test/panel-data.test.ts \
            test/paths.test.ts \
            test/recorder.test.ts \
            test/reports.test.ts \
            test/stats.test.ts \
            test/text.test.ts

      - name: Bench the read paths
        if: runner.os == 'Linux'
        run: bun run bench --budget
